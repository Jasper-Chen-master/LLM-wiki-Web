          - paragraph [ref=e197]: "Materials 2025, 18, 2555 4 of 19 The experimental conditions set for this experiment were as follows: electrolyte con- centration: 0.1–2 mol/L; voltage: 8–16 V; pH: 0.8–3.2; and duration of electricity supply: 1–9 h. A homogeneous experimental design table was designed from the described ex- perimental factors and variable levels as shown in Table 2. After the completion of the reactions in each group, a 30% H2 O2 solution was slowly added to the suspension and the suspension was stirred for 1 h. Subsequently, the precipitate was filtered and washed multiple times and then placed in a blast-drying oven for drying at 80 ◦ C for 12 h. Finally, the FePO4 ·2H2 O sample was obtained. The obtained FePO4 ·2H2 O samples were mixed with lithium acetate (Fe/Li molar ratio of 1:1.05) and 10 wt.% ascorbic acid as a carbon source. The mixture was dispersed in 70 mL anhydrous ethanol and stirred at 70 ◦ C for 6 h. After drying, the mixture was sintered at 650 ◦ C for 8 h under an argon atmosphere to obtain LiFePO4 /C samples. The crystallinity of the sample was examined by X-ray diffraction (XRD diffractometer Ultima IV Rigo, Rigaku Corporation, Tokyo, Japan). Test conditions were as follows: target material: Cu target; tube voltage: 35 kV; tube current: 30 mA; and scanning speed: 5◦ /min. The surface of FP material was analyzed using a scanning electron microscope (SEM, S-4800, Hitachi, Tokyo, Japan). The surface morphology of the FP material was analyzed and observed by transmission electron microscopy (TEM FEI Talos F200X, Thermo Fisher Scientific, Waltham, MA, USA), and the content of each element in the FP material was quantitatively analyzed by an inductively coupled plasma optical emission spectrometer (ICP-OES AGILENT 725-ES, Agilent Technologies, Wilmington, DE, USA). The content of the crystalline water in the FP material was determined by a thermogravimetric thermal difference analysis (TG-DSC STA6000, PerkinElmer, Waltham, MA, USA) at a heating rate of 10 ◦ C/min. The test temperature range was 30–800 ◦ C. To further evaluate the performance of the iron phosphate precursor, a LiFePO4 /C cathode material was prepared from the precursor and assembled into 2025-coin cells. First, LiFePO4 /C, acetylene black, and PVDF were mixed in at a mass ratio of 8:1:1 with N-methyl-2-pyrrolidone to form a black slurry, which was then coated on aluminum foil. Subsequently, cathode material pellets (diameter: 12 mm) were prepared. Next, the cathode pellet, lithium metal foil, 1M LiPF6 /EC-EMC-DMC electrolyte (with a volume ratio of 1:1:1), and Polyethylene battery separator were assembled into the battery in an argon-filled glovebox. The first charge/discharge performance and 100-cycle performance were tested using a battery testing system (CT-3008W-5V-10mA, Neware, Shenzhen, China; voltage window: 2.5–4.2 V, and 1C rate: 170 mA h g−1 ). Cyclic voltammetry (CV) tests were performed at a scan rate of 0.5 mV s−1 . Electrochemical impedance spectroscopy (EIS) tests were conducted on both pre-cycling and post-cycling LFP cells. The battery assembly process is as follows: first, the negative shell containing the centrally positioned lithium plate is placed in the glove box. Next, 55 µL of electrolyte is added, followed by placing the separator on top. The lithium plate is subsequently positioned over the separator, and the positive electrode is placed thereafter. A second addition of an electrolyte is performed, after which the gaskets and shrapnel are added sequentially. Finally, the positive shell is placed, and the battery is sealed using an encapsu- lation machine (Crystal Precision Manufacturing, Shanghai, China). The assembled battery remains in the glove box for 24 h before being removed for the testing of its charging and discharging performance. 3. Results and Discussion 3.1. Synthesis Mechanism of FePO4 ·2H2 O Fe and Ni are located in the eighth group of the fourth period in the periodic table. Both element